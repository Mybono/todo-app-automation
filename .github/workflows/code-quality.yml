name: Code Quality

on: [pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PR CheckMate
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -v ${{ github.workspace }}/node_modules:/project/node_modules \
            -w /project \
            mybono/pr-checkmate:latest all
            