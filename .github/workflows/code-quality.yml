name: Code Quality

on: [pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Code Checks
        run: |
          docker run --rm \
            -v $(pwd):/project \
            -w /project \
            mybono/pr-checkmate:latest all