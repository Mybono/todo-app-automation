name: 🔍 PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests with coverage
        run: npm run test:unit

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # ============================================
  # Lint TypeScript
  # ============================================
  lint:
    name: 🧹 Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📏 Run ESLint
        run: npm run lint || echo "⚠️ ESLint failed but we continue"

  # ============================================
  # Dependency Check (не падает)
  # ============================================
  dependency-check:
    name: 📦 Dependency Changes
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 🔍 Check for dependency changes
        run: |
          if git diff origin/main...HEAD --name-only | grep -q 'package.*\.json'; then
            echo "⚠️ Dependencies changed! Review security, licenses, and bundle size."
          else
            echo "✅ No dependency changes detected."
          fi

  # ============================================
  # Prettier Auto-format (последним)
  # ============================================
  prettier-autoformat:
    name: 🎨 Auto-format Prettier
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install

      - name: 🎨 Format code with Prettier
        run: |
          echo "Available scripts:"
          npm run
          npm run format

      - name: 💾 Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- ':!./.github/**'

          if ! git diff --cached --quiet; then
            git commit -m "style: auto-format code with Prettier"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No formatting changes."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Spellcheck (Orfography)
  # ============================================
  spellcheck:
    name: 🔤 Spellcheck
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run cspell
        run: npx cspell "**/*.{ts,tsx,js,jsx,md,json}" --no-progress || true
