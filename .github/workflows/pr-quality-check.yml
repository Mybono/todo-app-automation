name: 🔍 PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests with coverage
        run: npm run test:unit

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  pr_checks:
    name: 🐳 Run PR Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Compute changed files
        id: changes
        run: |
          echo "CHANGED_FILES=$(git diff --name-only origin/main...HEAD)" >> $GITHUB_ENV

      - name: 🐳 Run PR Checks via Docker
        run: |
          docker run --rm \
            -e CHANGED_FILES="$CHANGED_FILES" \
            mybono/pr-checkmate:latest all

      - name: 💾 Commit and push fixes (if any)
        run: |
          git config user.name "pr-checks-bot"
          git config user.email "pr-checks-bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: auto-fix code with PR CheckMate"
          git pull --rebase origin ${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}