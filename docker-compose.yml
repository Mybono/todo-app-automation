version: "3.9"

services:
  todo-tests:
    build: .
    container_name: todo-app-tests
    ports:
      - "4723:4723"  # Expose Appium port to host
    volumes:
      - .:/usr/src/app                  # Mount project directory
      - ./reports:/usr/src/app/reports  # Mount reports folder to persist results
    environment:
      NODE_ENV: "test"
    # Command is already defined in Dockerfile, can be overridden if needed
    command: sh -c "npm install -g appium appium-uiautomator2-driver allure-commandline && appium & npm test"
